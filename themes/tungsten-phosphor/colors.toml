# Tungsten Phosphor — special edition, DARK terminal palette.
# Retro green-phosphor CRT: the classic P1 terminal glow on near-black.
# Roles: bg #060D08 · surface #0E1A10 · text #CFF5D3 · accent #00FF41 · accent-soft #5CFF86

# GUI accents for the Desktop app (ignored by CLI/TUI)
customCSS = """
/* Tungsten Phosphor — special edition */
::selection { background: rgba(0, 255, 65, 0.25); }
::-webkit-scrollbar-thumb { background: #1E3A26; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #00FF41; }
::-webkit-scrollbar-track { background: transparent; }
"""

tool_prefix = "❘"

banner_logo = """
[bold #00FF41]TUNGSTEN[/] [bold #5CFF86]PHOSPHOR[/]
"""

[backgrounds]
terminal = "#060D08"
status = "#0B140D"
completion = "#0E1A10"

[colors]
banner_border = "#1E3A26"
banner_title = "#00FF41"
banner_accent = "#5CFF86"
banner_dim = "#6FA07A"
banner_text = "#CFF5D3"
ui_accent = "#00FF41"
ui_label = "#5CFF86"
ui_ok = "#3EE06C"
ui_error = "#FF5C7A"
ui_warn = "#E8C44A"
prompt = "#CFF5D3"
input_rule = "#1E3A26"
response_border = "#00FF41"
session_label = "#5CFF86"
session_border = "#2A4A34"
status_bar_bg = "#0B140D"
voice_status_bg = "#0B140D"
selection_bg = "#0E3A1B"
completion_menu_bg = "#0E1A10"
completion_menu_current_bg = "#14301E"
completion_menu_meta_bg = "#0E1A10"
completion_menu_meta_current_bg = "#14301E"

[spinner]
waiting_faces = ["(0)", "(1)", "(0)"]
thinking_faces = ["(0)", "(1)", "{0}"]
thinking_verbs = [
  "warming the cathode",
  "refreshing the raster",
  "scrolling the green",
  "aligning the gun",
  "burning the phosphor",
]
wings = [["⟪0", "0⟫"], ["⟪1", "1⟫"]]

[branding]
agent_name = "Tungsten Phosphor"
welcome = "Welcome to the green screen — Tungsten Phosphor terminal ready. Type your message or /help for commands."
goodbye = "Screen blanked. The phosphor fades. ♪"
response_label = "▣ Phosphor"
prompt_symbol = "❯"
help_header = "(0) Available Commands"

[contrast]
banner_text = ["banner_text", "terminal", "text"]
banner_title = ["banner_title", "terminal", "text"]
banner_accent = ["banner_accent", "terminal", "accent"]
banner_dim = ["banner_dim", "terminal", "text"]
ui_accent = ["ui_accent", "terminal", "text"]
ui_label = ["ui_label", "terminal", "text"]
ui_ok = ["ui_ok", "terminal", "text"]
ui_error = ["ui_error", "terminal", "text"]
ui_warn = ["ui_warn", "terminal", "text"]
prompt = ["prompt", "terminal", "text"]
session_label = ["session_label", "terminal", "text"]

# ── Light polarity overlay ────────────────────────────────────────────────
# "Paper construct": a phosphor printout. Deep greens on green-tinted
# paper — the dark theme as a P1 screen photographed on paper stock.
# Accent #0E6B2E = the documented hypothetical light accent, now real.
[light.backgrounds]
terminal = "#F0F5EC"
status = "#F7FAF4"
completion = "#E6EEE5"

[light.colors]
banner_border = "#86A38E"
banner_title = "#0E6B2E"
banner_accent = "#2E7D44"
banner_dim = "#4A6B54"
banner_text = "#12351C"
ui_accent = "#0E6B2E"
ui_label = "#2E7D44"
ui_ok = "#2E6B32"
ui_error = "#B23244"
ui_warn = "#7A6000"
prompt = "#12351C"
input_rule = "#86A38E"
response_border = "#0E6B2E"
session_label = "#0E6B2E"
session_border = "#5E7A66"
status_bar_bg = "#F7FAF4"
voice_status_bg = "#F7FAF4"
selection_bg = "#BFE8C6"
completion_menu_bg = "#E6EEE5"
completion_menu_current_bg = "#CBEBD2"
completion_menu_meta_bg = "#E6EEE5"
completion_menu_meta_current_bg = "#CBEBD2"

[light.contrast]
banner_text = ["banner_text", "terminal", "text"]
banner_title = ["banner_title", "terminal", "text"]
banner_accent = ["banner_accent", "terminal", "accent"]
banner_dim = ["banner_dim", "terminal", "text"]
ui_accent = ["ui_accent", "terminal", "text"]
ui_label = ["ui_label", "terminal", "text"]
ui_ok = ["ui_ok", "terminal", "text"]
ui_error = ["ui_error", "terminal", "text"]
ui_warn = ["ui_warn", "terminal", "text"]
