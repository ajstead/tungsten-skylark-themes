ui_ok = "#45742A"
ui_error = "#B53F4E"
ui_warn = "#B34423"
prompt = "#33261A"
input_rule = "#D2C8B3"
response_border = "#A0521C"
session_label = "#834317"
session_border = "#A29785"
status_bar_bg = "#F5EDDC"
voice_status_bg = "#F5EDDC"
selection_bg = "#DEC29F"
completion_menu_bg = "#FAF3E3"
completion_menu_current_bg = "#EBDFC5"
completion_menu_meta_bg = "#FAF3E3"
completion_menu_meta_current_bg = "#EBDFC5"

[light.contrast]
banner_text = ["banner_text", "terminal", "text"]
banner_title = ["banner_title", "terminal", "text"]
