# Tungsten Brassworks — permanent collection theme, DUAL-mode steampunk palette.
# Copper gaslight on aged iron: the only copper/parchment voice in the set.
# Roles: bg #1A130D · surface #2A1F15 · text #EFE2C8 · accent #E08A3C · accent-soft #C48A55
# Eleventh collection member, brand-ratified 11 Nov 2026.

# GUI accents for the Desktop app (ignored by CLI/TUI)
customCSS = """
/* Tungsten Brassworks — permanent collection theme */
::selection { background: rgba(224, 138, 60, 0.25); }
::-webkit-scrollbar-thumb { background: #3C342B; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #E08A3C; }
::-webkit-scrollbar-track { background: transparent; }
"""

tool_prefix = "❘"

banner_logo = """
[bold #E08A3C]TUNGSTEN[/] [bold #C48A55]BRASSWORKS[/]
"""

[backgrounds]
terminal = "#1A130D"
status = "#211910"
completion = "#2A1F15"

[colors]
banner_border = "#3C342B"
banner_title = "#E08A3C"
banner_accent = "#C48A55"
banner_dim = "#A39885"
banner_text = "#EFE2C8"
ui_accent = "#E08A3C"
ui_label = "#C48A55"
ui_ok = "#76BE51"
ui_error = "#E86577"
ui_warn = "#FF7A4E"
prompt = "#EFE2C8"
input_rule = "#3C342B"
response_border = "#E08A3C"
session_label = "#C48A55"
session_border = "#696052"
status_bar_bg = "#211910"
voice_status_bg = "#211910"
selection_bg = "#472F19"
completion_menu_bg = "#2A1F15"
completion_menu_current_bg = "#3B2F1F"
completion_menu_meta_bg = "#2A1F15"
completion_menu_meta_current_bg = "#3B2F1F"

[spinner]
waiting_faces = ["(—)", "(●)", "(—)"]
thinking_faces = ["(—)", "(●)", "{0}"]
thinking_verbs = [
  "stoking the boiler",
  "polishing the brass",
  "raising pressure",
  "winding the mainspring",
  "charting the aether",
]
wings = [["«", "»"], ["‹", "›"]]

[branding]
agent_name = "Tungsten Brassworks"
welcome = "All aboard the brass sky. The workshop is lit — type your message or /help for commands."
goodbye = "Pressure released. The lamps go down. ⚙"
response_label = "⚙ Workshop"
prompt_symbol = "⚙"
help_header = "(⚙) Available Commands"

[contrast]
banner_text = ["banner_text", "terminal", "text"]
banner_title = ["banner_title", "terminal", "text"]
banner_accent = ["banner_accent", "terminal", "accent"]
banner_dim = ["banner_dim", "terminal", "text"]
ui_accent = ["ui_accent", "terminal", "text"]
ui_label = ["ui_label", "terminal", "text"]
ui_ok = ["ui_ok", "terminal", "text"]
ui_error = ["ui_error", "terminal", "text"]
ui_warn = ["ui_warn", "terminal", "text"]
prompt = ["prompt", "terminal", "text"]
session_label = ["session_label", "terminal", "text"]

# ── Light polarity overlay ────────────────────────────────────────────────
# "Parchment & Copper": the engineer's blueprint notebook. Oxidised copper
# accents on aged parchment — the gaslight workshop by daylight.
# Accent #A0521C = text-safe copper; label #834317 = deep engraving ink.
[light.backgrounds]
terminal = "#F0E7D0"
